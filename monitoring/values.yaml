# Uproszczona konfiguracja dla pojedynczego węzła K3s na Raspberry Pi.

alertmanager:
  enabled: false

grafana:
  enabled: true
  # adminPassword omitted from the public export; configure credentials privately.

  service:
    type: NodePort
    nodePort: 30300

  persistence:
    enabled: true
    type: sts
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 2Gi

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: "8GB"

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1500Mi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 300m
      memory: 300Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus-node-exporter:
  extraArgs:
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
  extraHostVolumeMounts:
    - name: textfile
      hostPath: /var/lib/node_exporter/textfile_collector
      mountPath: /host/root/var/lib/node_exporter/textfile_collector
      readOnly: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# K3s uruchamia część komponentów control plane w jednym procesie.
# Wyłączamy monitory, które często wskazują fałszywy stan Down.
kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false


